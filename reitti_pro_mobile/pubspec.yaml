name: reitti_pro_mobile
description: Reitti Pro - Mobile route planning application
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.6
  go_router: ^13.0.0
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Location
  geolocator: ^11.0.0
  permission_handler: ^11.1.0
  
  # Utils
  intl: ^0.19.0
  logger: ^2.0.2+1
  flutter_dotenv: ^5.1.0
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  retrofit_generator: ^8.0.4
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon.png"
  remove_alpha_ios: true


flutter:
  uses-material-design: true
  assets:
    - assets/.env
  


# The distributionBase property determines where Gradle distributions are unpacked.
# GRADLE_USER_HOME (the default) is in the .gradle directory in the user's home directory.
distributionBase=GRADLE_USER_HOME
# The distributionPath property specifies the path within the distributionBase where the distribution is unpacked.
distributionPath=wrapper/dists
# The distributionUrl property is the URL from which the Gradle distribution is downloaded.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
# The zipStoreBase property determines where the downloaded Gradle distribution zip file is stored.
# GRADLE_USER_HOME (the default) is in the .gradle directory in the user's home directory.
zipStoreBase=GRADLE_USER_HOME
# The zipStorePath property specifies the path within the zipStoreBase where the distribution zip is stored.
zipStorePath=wrapper/dists

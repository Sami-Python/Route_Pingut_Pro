version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meteo-backend
    ports:
      - "8081:8081"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - meteo-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meteo-frontend
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend
    networks:
      - meteo-network
    restart: unless-stopped

networks:
  meteo-network:
    driver: bridge